# Local MySQL only:  docker compose up -d db   (or use your own MySQL 8 and run backend/sql/schema.sql)
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: smart_carpark
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes:
      - dbdata:/var/lib/mysql
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
volumes:
  dbdata:
